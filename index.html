<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2D4A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="InspectDraft — Smarter home inspections. Faster, easier, more accurate. AI structures your words only." />
  <title>InspectDraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/app-icon.svg" />
</head>
<body>
  <div id="app">
    <!-- Header — navy chrome -->
    <header class="app-header" id="app-header">
      <button type="button" class="btn-icon back-btn hidden" id="btn-back" aria-label="Back">←</button>
      <img class="header-logo" id="header-logo" src="assets/brand/logo-mark.svg" alt="" width="32" height="32" />
      <div class="header-titles">
        <h1 id="header-title"><span class="inspect">Inspect</span><span class="draft" style="color:#00C853">Draft</span></h1>
        <p class="header-sub" id="header-sub">INSPECT / CAPTURE / REPORT</p>
      </div>
      <button type="button" class="btn-icon" id="btn-theme" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav hidden" id="bottom-nav">
      <button type="button" class="nav-item" data-view="sections" id="nav-sections">
        <span class="nav-icon">📋</span>
        <span>Sections</span>
      </button>
      <button type="button" class="nav-item" data-view="preview" id="nav-preview">
        <span class="nav-icon">📄</span>
        <span>Preview</span>
      </button>
      <button type="button" class="nav-item" data-view="export" id="nav-export">
        <span class="nav-icon">🖨️</span>
        <span>Export</span>
      </button>
    </nav>
  </div>

  <!-- Modal root -->
  <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
